<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Admin - Registrations</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 30px; }
    h1 { color: #333; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    th { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 14px 16px; text-align: left; font-size: 0.85rem; }
    td { padding: 12px 16px; border-bottom: 1px solid #eee; font-size: 0.9rem; color: #444; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f9f9ff; }
    .count { color: #666; margin-bottom: 16px; font-size: 0.95rem; }
  </style>
</head>
<body>
  <h1>📋 Registered Students</h1>
  <p class="count">Total registrations: <strong>{{ registrations|length }}</strong></p>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Full Name</th>
        <th>Student ID</th>
        <th>Course</th>
        <th>Event Name</th>
        <th>Registered At</th>
      </tr>
    </thead>
    <tbody>
      {% for row in registrations %}
      <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>
        <td>{{ row[4] }}</td>
        <td>{{ row[5] }}</td>
      </tr>
      {% else %}
      <tr><td colspan="6" style="text-align:center; color:#999;">No registrations yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
